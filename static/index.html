  async function renderTeamAccountsTab() {
    document.getElementById('wj-content').innerHTML = `<div class="wj-card"><div class="wj-empty">불러오는 중...</div></div>`;
    let users = [];
    try {
      const res = await fetch('/api/admin/users');
      if (res.ok) users = await res.json();
    } catch (e) {}

    const html = `<div class="wj-card">
      <h3>팀원 계정 목록 (${users.length}명)</h3>
      <p class="wj-card-note">누구나 가입 즉시 바로 사용할 수 있어요. 이 화면에서는 역할 변경과, 퇴사자 등 더 이상 접근하면 안 되는 계정을 내보내는 것만 할 수 있어요. 각 팀원의 개인 업무 기록 내용은 여기서도 조회할 수 없습니다.</p>
      ${users.map(u => `<div class="wj-manage-row">
        <span>${esc(u.email)} <span class="wj-count-badge">${u.role === 'admin' ? '계정관리자' : '일반'}</span></span>
        <div style="display:flex; gap:6px; align-items:center">
          <select class="wj-select" style="width:auto; padding:5px 8px; font-size:12.5px" data-team-role="${u.id}">
            <option value="member" ${u.role==='member'?'selected':''}>일반</option>
            <option value="admin" ${u.role==='admin'?'selected':''}>계정관리자</option>
          </select>
          <button class="wj-btn danger-ghost" data-team-remove="${u.id}">내보내기</button>
        </div>
      </div>`).join('')}
    </div>`;

    document.getElementById('wj-content').innerHTML = html;

    document.querySelectorAll('[data-team-role]').forEach(sel => {
      sel.addEventListener('change', async (e) => {
        const res = await fetch(`/api/admin/users/${sel.dataset.teamRole}/role`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ role: e.target.value })
        });
        const data = await res.json();
        if (!res.ok) { showToast(data.detail || '변경에 실패했습니다.'); renderTeamAccountsTab(); return; }
        showToast('역할이 변경되었습니다.');
      });
    });
    document.querySelectorAll('[data-team-remove]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const res = await fetch(`/api/admin/users/${btn.dataset.teamRemove}/remove`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) { showToast(data.detail || '내보내기에 실패했습니다.'); return; }
        showToast('팀원을 내보냈습니다.');
        renderTeamAccountsTab();
      });
    });
  }

  function render() {
    if (state.tab === 'admin' && state.myRole === 'member') state.tab = 'manage';
    if (state.tab === 'teamaccounts' && !(window.__insysCurrentUser && window.__insysCurrentUser.role === 'admin')) state.tab = 'manage';
    renderTabs();
    if (!state.loaded) {
      document.getElementById('wj-content').innerHTML = `<div class="wj-empty">불러오는 중...</div>`;
      return;
    }
    if (state.tab === 'record') renderRecordTab();
    else if (state.tab === 'view') renderViewTab();
    else if (state.tab === 'admin') renderAdminTab();
    else if (state.tab === 'teamaccounts') renderTeamAccountsTab();
    else renderManageTab();
  }

  window.__insysInit = function() {
    render();
    loadData();
  };
})();
</script>

<script>
(function() {
  const authScreen = document.getElementById('wj-auth-screen');
  const appShell = document.getElementById('wj-app-shell');
  const emailInput = document.getElementById('wj-auth-email');
  const passwordInput = document.getElementById('wj-auth-password');
  const submitBtn = document.getElementById('wj-auth-submit');
  const errorEl = document.getElementById('wj-auth-error');
  const noticeEl = document.getElementById('wj-auth-notice');
  const subEl = document.getElementById('wj-auth-title-sub');
  const switchWrap = document.getElementById('wj-auth-switch');
  const logoutBtn = document.getElementById('wj-logout-btn');
  const userBadge = document.getElementById('wj-user-badge');

  let mode = 'login'; // 'login' | 'signup'

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
    noticeEl.style.display = 'none';
  }
  function showNotice(msg) {
    noticeEl.textContent = msg;
    noticeEl.style.display = 'block';
    errorEl.style.display = 'none';
  }
  function clearMessages() {
    errorEl.style.display = 'none';
    noticeEl.style.display = 'none';
  }

  function setMode(next) {
    mode = next;
    clearMessages();
    if (mode === 'login') {
      subEl.textContent = '로그인해서 계속하기';
      submitBtn.textContent = '로그인';
      switchWrap.innerHTML = '계정이 없으신가요? <a id="wj-auth-switch-link">가입하기</a>';
    } else {
      subEl.textContent = '새 계정 만들기';
      submitBtn.textContent = '가입하기';
      switchWrap.innerHTML = '이미 계정이 있으신가요? <a id="wj-auth-switch-link">로그인하기</a>';
    }
    document.getElementById('wj-auth-switch-link').addEventListener('click', () => {
      setMode(mode === 'login' ? 'signup' : 'login');
    });
  }

  async function showApp(userInfo) {
    authScreen.style.display = 'none';
    appShell.style.display = 'block';
    userBadge.textContent = `${userInfo.email}${userInfo.role === 'admin' ? ' · 계정관리자' : ''}`;
    window.__insysCurrentUser = userInfo;
    window.__insysInit();
  }

  async function checkSession() {
    try {
      const res = await fetch('/api/auth/me');
      if (res.ok) {
        const info = await res.json();
        showApp(info);
        return;
      }
    } catch (e) {}
    authScreen.style.display = 'flex';
    appShell.style.display = 'none';
  }

  submitBtn.addEventListener('click', async () => {
    clearMessages();
    const email = (emailInput.value || '').trim();
    const password = passwordInput.value || '';
    if (!email || !password) { showError('이메일과 비밀번호를 입력해주세요.'); return; }

    submitBtn.disabled = true;
    try {
      if (mode === 'login') {
        const res = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) { showError(data.detail || '로그인에 실패했습니다.'); return; }
        showApp(data);
      } else {
        const res = await fetch('/api/auth/signup', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) { showError(data.detail || '가입에 실패했습니다.'); return; }
        showApp({ email, role: data.role || 'member' });
      }
    } catch (e) {
      showError('네트워크 오류가 발생했습니다.');
    } finally {
      submitBtn.disabled = false;
    }
  });

  logoutBtn.addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method: 'POST' });
    location.reload();
  });

  document.getElementById('wj-auth-switch-link').addEventListener('click', () => {
    setMode(mode === 'login' ? 'signup' : 'login');
  });

  checkSession();
})();
</script>
</body>
</html>
